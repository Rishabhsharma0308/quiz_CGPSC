<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPSC Prelims Mock Test AI</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for compiling JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- SUBJECTS DEFINITION ---
        const CG_SUBJECTS = [
            "History of CG & Freedom Struggle",
            "Geography, Climate, Tourism & Census of CG",
            "Local Tribes, Traditions, Festivals & Teej",
            "Art, Folk Songs, Literature, Idioms (Hana/Janula)",
            "Administrative Structure & Panchayati Raj of CG",
            "Economy, Forest, Minerals & Industry of CG",
            "Current Affairs of Chhattisgarh"
        ];

        const INDIA_SUBJECTS = [
            "Indian History & National Movement",
            "Physical, Social & Economic Geography",
            "Constitution of India & Polity",
            "Indian Economy",
            "General Science & Technology",
            "Environment & Ecology",
            "Indian Philosophy, Art, Literature & Culture",
            "National/International Current Affairs & Sports"
        ];

        const ALL_SUBJECTS_OPTION = "All Subjects (Mixed)";
        const ALL_AVAILABLE_SUBJECTS = [...CG_SUBJECTS, ...INDIA_SUBJECTS];
        const DEFAULT_SHEET_URL = "https://script.google.com/macros/s/AKfycbw3L-Izjab15W48uG2IyYjUbhii7BAOZkSFdbAD0tHFjJDymQXDP5HFdsRQ8-zm0qSp/exec";

        const App = () => {
            const [selectedSubject, setSelectedSubject] = useState(ALL_SUBJECTS_OPTION);
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [loading, setLoading] = useState(false);
            const [selectedOption, setSelectedOption] = useState(null);
            const [isAnswerSubmitted, setIsAnswerSubmitted] = useState(false);
            const [history, setHistory] = useState([]);
            const [sheetStatus, setSheetStatus] = useState("");
            const [errorMsg, setErrorMsg] = useState("");
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [activeTab, setActiveTab] = useState("quiz"); // 'quiz', 'history', 'settings'

            // User Settings State
            const [apiKey, setApiKey] = useState("");
            const [sheetUrl, setSheetUrl] = useState(DEFAULT_SHEET_URL);

            // Load local history and settings on mount
            useEffect(() => {
                const savedHistory = localStorage.getItem('cgpsc_history');
                const savedKey = localStorage.getItem('cgpsc_api_key');
                const savedSheet = localStorage.getItem('cgpsc_sheet_url');

                if (savedHistory) {
                    try { setHistory(JSON.parse(savedHistory)); } catch (e) { console.error(e); }
                }
                if (savedKey) setApiKey(savedKey);
                if (savedSheet) setSheetUrl(savedSheet);
            }, []);

            // Save History to local storage whenever it changes
            useEffect(() => {
                if (history.length > 0) {
                    localStorage.setItem('cgpsc_history', JSON.stringify(history));
                }
            }, [history]);

            // Save Settings
            const handleSaveApiKey = (key) => {
                setApiKey(key);
                localStorage.setItem('cgpsc_api_key', key);
            };

            const handleSaveSheetUrl = (url) => {
                setSheetUrl(url);
                localStorage.setItem('cgpsc_sheet_url', url);
            };

            // Fetch question on subject change or manual trigger
            const fetchQuestion = async () => {
                setLoading(true);
                setErrorMsg("");
                setSelectedOption(null);
                setIsAnswerSubmitted(false);
                setCurrentQuestion(null);
                setSheetStatus("");

                if (!apiKey) {
                    setErrorMsg("Please enter your Gemini API Key in the Settings tab first.");
                    setLoading(false);
                    return;
                }

                // Determine actual subject if "All Subjects" is selected
                let promptSubject = selectedSubject;
                if (selectedSubject === ALL_SUBJECTS_OPTION) {
                    promptSubject = ALL_AVAILABLE_SUBJECTS[Math.floor(Math.random() * ALL_AVAILABLE_SUBJECTS.length)];
                }

                // 80% Expected, 20% PYQ
                const isPYQTarget = Math.random() < 0.20;
                
                const prompt = `You are an expert examiner for the Chhattisgarh Public Service Commission (CGPSC) Prelims exam.
                Generate a highly accurate, standard-level Multiple Choice Question (MCQ) for the subject: "${promptSubject}".
                
                Guidelines:
                1. Make the question challenging and relevant to the CGPSC syllabus.
                2. Provide exactly 4 options.
                3. ${isPYQTarget ? "Make this a simulated Previous Year Question (PYQ). Provide a realistic year in the pyqYear field (e.g., 'CGPSC 2021'). Set isPYQ to true." : "Make this a highly expected new question based on current trends. Set isPYQ to false, and leave pyqYear empty."}
                4. The explanation should be detailed and educational.
                5. DO NOT use markdown formatting outside the JSON block. Return ONLY raw JSON.`;

                const systemInstruction = "You must output purely valid JSON conforming to the requested schema. Do not wrap in ```json block.";

                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: { parts: [{ text: systemInstruction }] },
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                question: { type: "STRING" },
                                options: { type: "ARRAY", items: { type: "STRING" } },
                                correctAnswer: { type: "STRING" },
                                explanation: { type: "STRING" },
                                isPYQ: { type: "BOOLEAN" },
                                pyqYear: { type: "STRING" }
                            },
                            required: ["question", "options", "correctAnswer", "explanation", "isPYQ", "pyqYear"]
                        }
                    }
                };

                const generateWithRetry = async (retries = 3) => {
                    let delay = 1000;
                    for (let i = 0; i < retries; i++) {
                        try {
                            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });
                            
                            if (!res.ok) throw new Error(`API Error: ${res.status}`);
                            
                            const data = await res.json();
                            let textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;
                            
                            if (!textResponse) throw new Error("Empty response from AI");
                            
                            textResponse = textResponse.replace(/^```json\s*/, '').replace(/\s*```$/, '');
                            return JSON.parse(textResponse);
                        } catch (err) {
                            if (i === retries - 1) throw err;
                            await new Promise(resolve => setTimeout(resolve, delay));
                            delay *= 2;
                        }
                    }
                };

                try {
                    const parsedData = await generateWithRetry();
                    setCurrentQuestion({ ...parsedData, actualSubject: promptSubject });
                } catch (err) {
                    if (err.message.includes("401")) {
                        setErrorMsg("API Key Error: Your API key is invalid or unauthorized. Please check the Settings tab.");
                    } else if (err.message.includes("429")) {
                        setErrorMsg("Too many requests! Please wait about 60 seconds before trying again.");
                    } else {
                        setErrorMsg("Failed to generate question. Please check your internet or API key.");
                    }
                    console.error(err);
                } finally {
                    setLoading(false);
                }
            };

            // Initial load (only if key exists)
            useEffect(() => {
                if (apiKey && activeTab === 'quiz') {
                    fetchQuestion();
                }
            }, [selectedSubject]);

            const submitAnswer = async () => {
                if (!selectedOption) return;
                setIsAnswerSubmitted(true);

                const isCorrect = selectedOption === currentQuestion.correctAnswer;
                
                const historyEntry = {
                    id: Date.now(),
                    subject: currentQuestion.actualSubject,
                    question: currentQuestion.question,
                    myAnswer: selectedOption,
                    correctAnswer: currentQuestion.correctAnswer,
                    isCorrect: isCorrect,
                    explanation: currentQuestion.explanation,
                    type: currentQuestion.isPYQ ? currentQuestion.pyqYear : 'Expected Question',
                    timestamp: new Date().toLocaleString()
                };
                
                setHistory(prev => [historyEntry, ...prev]);

                const sheetData = {
                    subject: currentQuestion.actualSubject,
                    question: currentQuestion.question,
                    chosenAnswer: selectedOption,
                    correctAnswer: currentQuestion.correctAnswer,
                    isCorrect: isCorrect,
                    pyqYear: currentQuestion.isPYQ ? currentQuestion.pyqYear : 'Expected Question',
                    explanation: currentQuestion.explanation
                };

                if (sheetUrl) {
                    setSheetStatus("Saving to Google Sheets...");
                    try {
                        await fetch(sheetUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: {
                                'Content-Type': 'text/plain',
                            },
                            body: JSON.stringify(sheetData)
                        });
                        setSheetStatus("✓ Saved securely to Google Sheet");
                        setTimeout(() => setSheetStatus(""), 3000);
                    } catch (error) {
                        console.error("Sheet Error:", error);
                        setSheetStatus("Failed to save to sheet. Check console.");
                    }
                }
            };

            const renderSidebar = () => (
                <div className={`fixed inset-y-0 left-0 z-40 w-72 bg-white shadow-xl transform transition-transform duration-300 ease-in-out flex flex-col md:translate-x-0 md:static md:w-80 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                    <div className="p-4 border-b flex justify-between items-center bg-blue-700 text-white">
                        <h2 className="text-xl font-bold flex items-center gap-2">
                            <i className="fa-solid fa-graduation-cap"></i> CGPSC Prep
                        </h2>
                        <button className="md:hidden text-white" onClick={() => setSidebarOpen(false)}>
                            <i className="fa-solid fa-xmark text-xl"></i>
                        </button>
                    </div>
                    
                    <div className="flex-1 overflow-y-auto p-4 space-y-6">
                        <div>
                            <button 
                                onClick={() => { setSelectedSubject(ALL_SUBJECTS_OPTION); setSidebarOpen(false); setActiveTab('quiz'); }}
                                className={`w-full text-left px-4 py-3 rounded-lg font-bold border-2 transition-colors ${selectedSubject === ALL_SUBJECTS_OPTION ? 'bg-blue-50 border-blue-600 text-blue-700' : 'border-gray-200 hover:border-blue-300 hover:bg-gray-50 text-gray-700'}`}
                            >
                                <i className="fa-solid fa-shuffle mr-2 text-blue-500"></i> {ALL_SUBJECTS_OPTION}
                            </button>
                        </div>
                        <div>
                            <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Chhattisgarh General Knowledge</h3>
                            <div className="space-y-1">
                                {CG_SUBJECTS.map(subject => (
                                    <button 
                                        key={subject}
                                        onClick={() => { setSelectedSubject(subject); setSidebarOpen(false); setActiveTab('quiz'); }}
                                        className={`w-full text-left px-3 py-2 rounded-md text-sm transition-colors ${selectedSubject === subject ? 'bg-blue-100 text-blue-800 font-semibold' : 'text-gray-600 hover:bg-gray-100'}`}
                                    >
                                        {subject}
                                    </button>
                                ))}
                            </div>
                        </div>
                        <div>
                            <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Indian General Studies</h3>
                            <div className="space-y-1">
                                {INDIA_SUBJECTS.map(subject => (
                                    <button 
                                        key={subject}
                                        onClick={() => { setSelectedSubject(subject); setSidebarOpen(false); setActiveTab('quiz'); }}
                                        className={`w-full text-left px-3 py-2 rounded-md text-sm transition-colors ${selectedSubject === subject ? 'bg-indigo-100 text-indigo-800 font-semibold' : 'text-gray-600 hover:bg-gray-100'}`}
                                    >
                                        {subject}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );

            const renderSettings = () => (
                <div className="max-w-3xl mx-auto w-full">
                    <div className="bg-white rounded-xl shadow-sm border p-6 md:p-8">
                        <div className="mb-8">
                            <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
                                <i className="fa-solid fa-gear text-blue-600"></i> Configuration
                            </h2>
                            <p className="text-gray-500 mt-2">Set up your API keys and external integrations here. This data is saved securely on your local device.</p>
                        </div>

                        <div className="space-y-8">
                            {/* Gemini API Key */}
                            <div className="bg-gray-50 p-6 rounded-lg border">
                                <label className="block text-gray-800 font-bold mb-2 flex items-center gap-2">
                                    <i className="fa-solid fa-key text-yellow-500"></i> Gemini API Key
                                </label>
                                <p className="text-sm text-gray-600 mb-4">
                                    Required to generate questions. Get a free key from <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-blue-600 font-medium hover:underline">Google AI Studio</a>.
                                </p>
                                <input
                                    type="password"
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono"
                                    placeholder="AIzaSy..."
                                    value={apiKey}
                                    onChange={(e) => handleSaveApiKey(e.target.value)}
                                />
                                {apiKey ? (
                                    <p className="text-sm text-green-600 mt-2 font-medium flex items-center gap-1">
                                        <i className="fa-solid fa-check-circle"></i> API Key is saved.
                                    </p>
                                ) : (
                                    <p className="text-sm text-red-500 mt-2 font-medium flex items-center gap-1">
                                        <i className="fa-solid fa-triangle-exclamation"></i> API Key is required to use this app.
                                    </p>
                                )}
                            </div>

                            {/* Google Sheets URL */}
                            <div className="bg-gray-50 p-6 rounded-lg border">
                                <label className="block text-gray-800 font-bold mb-2 flex items-center gap-2">
                                    <i className="fa-brands fa-google-drive text-green-600"></i> Google Sheets Webhook URL (Optional)
                                </label>
                                <p className="text-sm text-gray-600 mb-4">
                                    Paste your Google Apps Script URL here to automatically log all your answers to a spreadsheet.
                                </p>
                                <input
                                    type="text"
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 font-mono text-sm"
                                    placeholder="https://script.google.com/macros/s/..."
                                    value={sheetUrl}
                                    onChange={(e) => handleSaveSheetUrl(e.target.value)}
                                />
                                {sheetUrl && (
                                    <p className="text-sm text-green-600 mt-2 font-medium flex items-center gap-1">
                                        <i className="fa-solid fa-check-circle"></i> Webhook URL is saved.
                                    </p>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );

            const renderQuiz = () => (
                <div className="max-w-3xl mx-auto w-full">
                    {/* Header Controls */}
                    <div className="bg-white rounded-xl shadow-sm border p-4 mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h2 className="text-lg font-bold text-gray-800">{selectedSubject}</h2>
                            {selectedSubject === ALL_SUBJECTS_OPTION && currentQuestion && (
                                <p className="text-sm text-blue-600 font-medium">Currently testing: {currentQuestion.actualSubject}</p>
                            )}
                        </div>
                        <button 
                            onClick={fetchQuestion}
                            disabled={loading || !apiKey}
                            className="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-lg font-medium shadow-sm transition-colors disabled:opacity-50 flex items-center gap-2 w-full sm:w-auto justify-center"
                        >
                            {loading ? <i className="fa-solid fa-circle-notch fa-spin"></i> : <i className="fa-solid fa-forward-step"></i>}
                            {loading ? "Generating..." : "Skip / Next Question"}
                        </button>
                    </div>

                    {errorMsg && (
                        <div className="bg-red-50 text-red-700 p-4 rounded-lg mb-6 flex items-start gap-3 border border-red-200">
                            <i className="fa-solid fa-triangle-exclamation mt-1"></i>
                            <div>
                                <p className="font-semibold">{errorMsg}</p>
                                {!apiKey && (
                                    <button onClick={() => setActiveTab('settings')} className="mt-2 text-sm bg-red-100 hover:bg-red-200 px-3 py-1 rounded font-medium transition-colors">
                                        Go to Settings &rarr;
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                    {loading && !currentQuestion ? (
                        <div className="bg-white rounded-xl shadow-sm border p-12 text-center">
                            <i className="fa-solid fa-microchip text-4xl text-blue-500 mb-4 animate-pulse"></i>
                            <h3 className="text-xl font-bold text-gray-800 mb-2">AI is drafting a question...</h3>
                            <p className="text-gray-500">Scanning syllabus & analyzing trends</p>
                        </div>
                    ) : currentQuestion ? (
                        <div className="bg-white rounded-xl shadow-sm border overflow-hidden">
                            <div className="p-6 border-b bg-gray-50 relative">
                                {currentQuestion.isPYQ && (
                                    <span className="absolute top-4 right-4 bg-yellow-100 text-yellow-800 text-xs font-bold px-3 py-1 rounded-full border border-yellow-300 shadow-sm flex items-center gap-1">
                                        <i className="fa-solid fa-award"></i> {currentQuestion.pyqYear}
                                    </span>
                                )}
                                {!currentQuestion.isPYQ && (
                                    <span className="absolute top-4 right-4 bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full border border-green-200 flex items-center gap-1">
                                        <i className="fa-solid fa-star"></i> Expected Question
                                    </span>
                                )}
                                <h3 className="text-xl font-bold text-gray-800 pr-24 mt-2">
                                    {currentQuestion.question}
                                </h3>
                            </div>

                            <div className="p-6 space-y-3">
                                {currentQuestion.options.map((opt, idx) => {
                                    let optionStyle = "border-gray-200 hover:border-blue-400 hover:bg-blue-50 text-gray-700 cursor-pointer";
                                    let icon = <span className="w-6 h-6 rounded-full border-2 border-gray-300 flex items-center justify-center text-xs font-bold text-gray-500 mr-3">{String.fromCharCode(65 + idx)}</span>;

                                    if (isAnswerSubmitted) {
                                        if (opt === currentQuestion.correctAnswer) {
                                            optionStyle = "bg-green-50 border-green-500 text-green-800";
                                            icon = <i className="fa-solid fa-circle-check text-green-500 text-xl mr-3"></i>;
                                        } else if (opt === selectedOption && opt !== currentQuestion.correctAnswer) {
                                            optionStyle = "bg-red-50 border-red-500 text-red-800";
                                            icon = <i className="fa-solid fa-circle-xmark text-red-500 text-xl mr-3"></i>;
                                        } else {
                                            optionStyle = "border-gray-200 opacity-50 cursor-not-allowed";
                                        }
                                    } else if (selectedOption === opt) {
                                        optionStyle = "bg-blue-50 border-blue-500 text-blue-800 ring-1 ring-blue-500";
                                        icon = <i className="fa-solid fa-circle-dot text-blue-600 text-xl mr-3"></i>;
                                    }

                                    return (
                                        <div 
                                            key={idx}
                                            onClick={() => !isAnswerSubmitted && setSelectedOption(opt)}
                                            className={`flex items-center p-4 rounded-xl border-2 transition-all ${optionStyle}`}
                                        >
                                            {icon}
                                            <span className="font-medium text-lg">{opt}</span>
                                        </div>
                                    );
                                })}
                            </div>

                            <div className="p-6 border-t bg-gray-50">
                                {!isAnswerSubmitted ? (
                                    <button 
                                        onClick={submitAnswer}
                                        disabled={!selectedOption}
                                        className="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-bold py-3 rounded-xl shadow-md transition-colors text-lg"
                                    >
                                        Check Answer
                                    </button>
                                ) : (
                                    <div className="space-y-4">
                                        <div className={`p-4 rounded-xl border ${selectedOption === currentQuestion.correctAnswer ? 'bg-green-100 border-green-300 text-green-900' : 'bg-red-100 border-red-300 text-red-900'}`}>
                                            <h4 className="font-bold flex items-center gap-2 mb-2">
                                                {selectedOption === currentQuestion.correctAnswer ? 
                                                    <><i className="fa-solid fa-check text-xl"></i> Excellent! Correct Answer.</> : 
                                                    <><i className="fa-solid fa-xmark text-xl"></i> Incorrect.</>}
                                            </h4>
                                            <p className="text-gray-800 mt-2"><span className="font-semibold">Explanation:</span> {currentQuestion.explanation}</p>
                                        </div>

                                        <div className="flex flex-col sm:flex-row justify-between items-center gap-4 pt-4 border-t border-gray-200">
                                            <p className="text-sm font-medium text-blue-600 h-6 flex items-center gap-2">
                                                {sheetStatus && <><i className="fa-solid fa-cloud-arrow-up"></i> {sheetStatus}</>}
                                            </p>
                                            <button 
                                                onClick={fetchQuestion}
                                                className="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-md transition-colors text-lg"
                                            >
                                                Next Question <i className="fa-solid fa-arrow-right ml-2"></i>
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    ) : null}
                </div>
            );

            const renderHistory = () => (
                <div className="max-w-4xl mx-auto w-full">
                    <div className="bg-white rounded-xl shadow-sm border p-6">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                            <div>
                                <h2 className="text-2xl font-bold text-gray-800">Session History</h2>
                                <p className="text-gray-500 text-sm">Review your past answers.</p>
                            </div>
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => {
                                        if(window.confirm('Are you sure you want to clear your local history?')) {
                                            setHistory([]);
                                            localStorage.removeItem('cgpsc_history');
                                        }
                                    }}
                                    className="bg-red-50 text-red-600 hover:bg-red-100 px-3 py-2 rounded-lg text-sm border border-red-200 transition-colors"
                                >
                                    <i className="fa-solid fa-trash-can"></i> Clear
                                </button>
                                {sheetUrl && (
                                    <div className="bg-blue-50 text-blue-800 px-4 py-2 rounded-lg text-sm border border-blue-200 flex items-center gap-2">
                                        <i className="fa-brands fa-google-drive text-lg"></i>
                                        <span className="hidden sm:inline">Saved to Sheets</span>
                                    </div>
                                )}
                            </div>
                        </div>

                        {history.length === 0 ? (
                            <div className="text-center py-12 bg-gray-50 rounded-lg border border-dashed border-gray-300">
                                <i className="fa-solid fa-clock-rotate-left text-4xl text-gray-300 mb-3"></i>
                                <p className="text-gray-500">You haven't answered any questions yet.</p>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                {history.map(item => (
                                    <div key={item.id} className="border rounded-xl p-5 hover:shadow-md transition-shadow relative overflow-hidden bg-white">
                                        <div className={`absolute top-0 left-0 w-2 h-full ${item.isCorrect ? 'bg-green-500' : 'bg-red-500'}`}></div>
                                        
                                        <div className="flex justify-between items-start mb-2 ml-4">
                                            <span className="text-xs font-bold text-gray-500 bg-gray-100 px-2 py-1 rounded">{item.subject}</span>
                                            <span className="text-xs text-gray-400">{item.timestamp}</span>
                                        </div>
                                        
                                        <h3 className="font-semibold text-gray-800 mb-3 ml-4">{item.question}</h3>
                                        
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 ml-4 bg-gray-50 p-4 rounded-lg">
                                            <div>
                                                <p className="text-xs text-gray-500 uppercase font-bold mb-1">Your Answer</p>
                                                <p className={`font-medium ${item.isCorrect ? 'text-green-700' : 'text-red-700'}`}>
                                                    {item.isCorrect ? <i className="fa-solid fa-check mr-1"></i> : <i className="fa-solid fa-xmark mr-1"></i>}
                                                    {item.myAnswer}
                                                </p>
                                            </div>
                                            <div>
                                                <p className="text-xs text-gray-500 uppercase font-bold mb-1">Correct Answer</p>
                                                <p className="font-medium text-green-700"><i className="fa-solid fa-check-double mr-1"></i> {item.correctAnswer}</p>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );

            return (
                <div className="flex h-screen bg-gray-50 overflow-hidden">
                    {sidebarOpen && (
                        <div 
                            className="fixed inset-0 bg-black bg-opacity-50 z-30 md:hidden"
                            onClick={() => setSidebarOpen(false)}
                        ></div>
                    )}

                    {renderSidebar()}

                    <div className="flex-1 flex flex-col h-full overflow-hidden relative">
                        <header className="bg-white shadow-sm border-b px-2 sm:px-4 py-3 flex items-center justify-between z-10 overflow-x-auto hide-scrollbar">
                            <div className="flex items-center gap-3 shrink-0 mr-4">
                                <button 
                                    className="md:hidden text-gray-600 hover:text-gray-900 focus:outline-none"
                                    onClick={() => setSidebarOpen(true)}
                                >
                                    <i className="fa-solid fa-bars text-xl"></i>
                                </button>
                                <h1 className="font-bold text-gray-800 text-lg md:text-xl truncate">CGPSC Mock</h1>
                            </div>
                            
                            <div className="flex bg-gray-100 rounded-lg p-1 border shrink-0">
                                <button 
                                    onClick={() => setActiveTab('quiz')}
                                    className={`px-3 sm:px-4 py-1.5 rounded-md text-sm font-semibold transition-colors ${activeTab === 'quiz' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                                >
                                    <i className="fa-solid fa-pen-nib mr-1"></i> Quiz
                                </button>
                                <button 
                                    onClick={() => setActiveTab('history')}
                                    className={`px-3 sm:px-4 py-1.5 rounded-md text-sm font-semibold transition-colors ${activeTab === 'history' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                                >
                                    <i className="fa-solid fa-list-check mr-1"></i> History
                                </button>
                                <button 
                                    onClick={() => setActiveTab('settings')}
                                    className={`px-3 sm:px-4 py-1.5 rounded-md text-sm font-semibold transition-colors ${activeTab === 'settings' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-600 hover:text-gray-900'}`}
                                >
                                    <i className="fa-solid fa-gear mr-1"></i> Settings
                                </button>
                            </div>
                        </header>

                        <main className="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8">
                            {activeTab === 'quiz' && renderQuiz()}
                            {activeTab === 'history' && renderHistory()}
                            {activeTab === 'settings' && renderSettings()}
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
